<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilingual Side-by-Side PDF Merger</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        /* Custom scrollbar styling for preview panes */
        .preview-pane::-webkit-scrollbar {
            width: 6px;
        }
        .preview-pane::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .preview-pane::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .preview-pane::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-lg sticky top-0 z-50">
        <div>
            <h1 class="text-xl font-bold text-white tracking-wide">Bilingual PDF Aligner</h1>
            <p class="text-xs text-slate-400">Merge Original & Translated documents side-by-side</p>
        </div>
        <button id="exportBtn" disabled 
                class="bg-slate-700 text-slate-400 font-semibold px-6 py-2.5 rounded-lg cursor-not-allowed transition-all duration-200 flex items-center gap-2 shadow-md">
            <span>Export Side-by-Side PDF</span>
        </button>
    </header>

    <main class="flex-1 flex p-6 gap-6 overflow-hidden h-[calc(100vh-80px)]">
        
        <section class="flex-1 flex flex-col bg-slate-800/50 border border-slate-700/60 rounded-xl p-4 overflow-hidden relative">
            <div class="flex items-center justify-between mb-3 border-b border-slate-700/50 pb-2">
                <h2 class="text-md font-semibold text-slate-200 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span> Left Side: Original PDF
                </h2>
                <span id="leftPageCount" class="text-xs text-slate-400 hidden">0 pages</span>
            </div>
            
            <label id="leftDropZone" class="flex-1 border-2 border-dashed border-slate-600 hover:border-blue-500 hover:bg-slate-800/40 rounded-xl flex flex-col items-center justify-center gap-3 cursor-pointer transition-all p-6 group">
                <input type="file" id="leftFileInput" accept="application/pdf" class="hidden">
                <div class="p-4 bg-slate-800 rounded-full group-hover:scale-105 transition-transform shadow-inner">
                    <svg class="w-8 h-8 text-slate-400 group-hover:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </div>
                <div class="text-center">
                    <p class="text-sm font-medium text-slate-300">Upload Original PDF</p>
                    <p class="text-xs text-slate-500 mt-1">Click or drag and drop file here</p>
                </div>
            </label>

            <div id="leftPreviewContainer" class="preview-pane flex-1 overflow-y-auto space-y-4 hidden bg-slate-900/40 p-4 rounded-xl border border-slate-800"></div>
        </section>

        <section class="flex-1 flex flex-col bg-slate-800/50 border border-slate-700/60 rounded-xl p-4 overflow-hidden relative">
            <div class="flex items-center justify-between mb-3 border-b border-slate-700/50 pb-2">
                <h2 class="text-md font-semibold text-slate-200 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Right Side: Translated PDF
                </h2>
                <span id="rightPageCount" class="text-xs text-slate-400 hidden">0 pages</span>
            </div>
            
            <label id="rightDropZone" class="flex-1 border-2 border-dashed border-slate-600 hover:border-emerald-500 hover:bg-slate-800/40 rounded-xl flex flex-col items-center justify-center gap-3 cursor-pointer transition-all p-6 group">
                <input type="file" id="rightFileInput" accept="application/pdf" class="hidden">
                <div class="p-4 bg-slate-800 rounded-full group-hover:scale-105 transition-transform shadow-inner">
                    <svg class="w-8 h-8 text-slate-400 group-hover:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </div>
                <div class="text-center">
                    <p class="text-sm font-medium text-slate-300">Upload Translated PDF</p>
                    <p class="text-xs text-slate-500 mt-1">Click or drag and drop file here</p>
                </div>
            </label>

            <div id="rightPreviewContainer" class="preview-pane flex-1 overflow-y-auto space-y-4 hidden bg-slate-900/40 p-4 rounded-xl border border-slate-800"></div>
        </section>

    </main>

    <div id="loadingOverlay" class="fixed inset-0 bg-slate-950/80 z-50 flex flex-col items-center justify-center gap-4 hidden backdrop-blur-sm">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <p id="loadingText" class="text-sm font-medium text-slate-300">Processing documents...</p>
    </div>

    <script>
        // Set up the PDF.js Global Worker configuration
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Document Reference State Store
        let filesState = {
            left: { bytes: null, doc: null },
            right: { bytes: null, doc: null }
        };

        // DOM Element Selector Registry
        const elements = {
            leftInput: document.getElementById('leftFileInput'),
            rightInput: document.getElementById('rightFileInput'),
            leftDropZone: document.getElementById('leftDropZone'),
            rightDropZone: document.getElementById('rightDropZone'),
            leftPreview: document.getElementById('leftPreviewContainer'),
            rightPreview: document.getElementById('rightPreviewContainer'),
            leftCount: document.getElementById('leftPageCount'),
            rightCount: document.getElementById('rightPageCount'),
            exportBtn: document.getElementById('exportBtn'),
            loader: document.getElementById('loadingOverlay'),
            loaderText: document.getElementById('loadingText')
        };

        // Bind Application File Input Triggers
        elements.leftInput.addEventListener('change', (e) => processFileSelection(e.target.files[0], 'left'));
        elements.rightInput.addEventListener('change', (e) => processFileSelection(e.target.files[0], 'right'));
        elements.exportBtn.addEventListener('click', generateSideBySidePdf);

        /**
         * Reads the selected file object into an ArrayBuffer and boots up rendering
         */
        async function processFileSelection(file, side) {
            if (!file || file.type !== 'application/pdf') return;
            
            showLoader(`Loading ${side === 'left' ? 'Original' : 'Translated'} document...`);
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                filesState[side].bytes = arrayBuffer;
                
                // Initialize rendering pipelines for standard viewports
                await renderLivePreviews(arrayBuffer, side);
                updateLayoutUIState(side);
            } catch (error) {
                console.error("Failed parsing PDF payload context: ", error);
                alert("Error parsing PDF file framework data.");
            } finally {
                hideLoader();
            }
        }

        /**
         * Uses PDF.js to render canvas snapshots of all document views sequentially
         */
        async function renderLivePreviews(buffer, side) {
            const container = side === 'left' ? elements.leftPreview : elements.rightPreview;
            const countLabel = side === 'left' ? elements.leftCount : elements.rightCount;
            const dropZone = side === 'left' ? elements.leftDropZone : elements.rightDropZone;

            container.innerHTML = ''; // Clear prior data
            
            // Instantiating viewport document handle
            const loadingTask = pdfjsLib.getDocument({ data: buffer.slice(0) });
            const pdfDoc = await loadingTask.promise;
            filesState[side].doc = pdfDoc;

            countLabel.textContent = `${pdfDoc.numPages} ${pdfDoc.numPages === 1 ? 'page' : 'pages'}`;
            countLabel.classList.remove('hidden');
            dropZone.classList.add('hidden');
            container.classList.remove('hidden');

            // Render loop scaling targets down asynchronously
            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.0 });

                // Generate layout elements to container grid viewport safely
                const wrapper = document.createElement('div');
                wrapper.className = 'bg-slate-950 p-2 rounded-lg border border-slate-800 flex flex-col items-center shadow-md';
                
                const canvas = document.createElement('canvas');
                canvas.className = 'w-full h-auto rounded max-w-full';
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const pageIndicator = document.createElement('span');
                pageIndicator.className = 'text-[10px] text-slate-500 font-mono mt-1.5';
                pageIndicator.textContent = `PAGE ${pageNum}`;

                wrapper.appendChild(canvas);
                wrapper.appendChild(pageIndicator);
                container.appendChild(wrapper);

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            }
        }

        /**
         * Controls standard button states mapping criteria evaluation
         */
        function updateLayoutUIState() {
            if (filesState.left.bytes && filesState.right.bytes) {
                elements.exportBtn.disabled = false;
                elements.exportBtn.className = "bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-2.5 rounded-lg cursor-pointer transition-all duration-200 flex items-center gap-2 shadow-md hover:shadow-blue-500/20 hover:scale-[1.02]";
            }
        }

        /**
         * Core PDF Execution Compiler Engine (Utilizes client memory space maps)
         */
        async function generateSideBySidePdf() {
            if (!filesState.left.bytes || !filesState.right.bytes) return;

            showLoader("Compiling side-by-side array buffers... Please wait.");

            try {
                // Initialize separate layout references securely
                const leftSourceDoc = await PDFLib.PDFDocument.load(filesState.left.bytes);
                const rightSourceDoc = await PDFLib.PDFDocument.load(filesState.right.bytes);
                const mergedPdf = await PDFLib.PDFDocument.create();

                const leftPageCount = leftSourceDoc.getPageCount();
                const rightPageCount = rightSourceDoc.getPageCount();
                const totalTargetPages = Math.max(leftPageCount, rightPageCount);

                // Iterate mirroring standard pages layout pairing architecture bounding checks
                for (let i = 0; i < totalTargetPages; i++) {
                    let pageWidth = 595.28;  // Default target dimensions initialization mapping fallback scale
                    let pageHeight = 841.89; // Standard A4 points default boundaries initialization

                    let leftPageRef = null;
                    let rightPageRef = null;

                    // Pull sizes to match sizing geometries dynamically
                    if (i < leftPageCount) {
                        leftPageRef = leftSourceDoc.getPages()[i];
                        pageWidth = leftPageRef.getWidth();
                        pageHeight = leftPageRef.getHeight();
                    } else if (i < rightPageCount) {
                        rightPageRef = rightSourceDoc.getPages()[i];
                        pageWidth = rightPageRef.getWidth();
                        pageHeight = rightPageRef.getHeight();
                    }

                    // Dynamically provision landscape canvas at exactly 2x standard structural width
                    const newPage = mergedPdf.addPage([pageWidth * 2, pageHeight]);

                    // Embed and draw original content to left alignment bounds
                    if (i < leftPageCount) {
                        const [embeddedLeft] = await mergedPdf.copyPages(leftSourceDoc, [i]);
                        const pageStructure = await mergedPdf.embedPage(embeddedLeft);
                        newPage.drawPage(pageStructure, { x: 0, y: 0, width: pageWidth, height: pageHeight });
                    }

                    // Embed and draw translated data payload to right orientation shifts
                    if (i < rightPageCount) {
                        const [embeddedRight] = await mergedPdf.copyPages(rightSourceDoc, [i]);
                        const pageStructure = await mergedPdf.embedPage(embeddedRight);
                        newPage.drawPage(pageStructure, { x: pageWidth, y: 0, width: pageWidth, height: pageHeight });
                    }
                }

                // Compress array objects into blob targets sequentially 
                const mergedPdfBytes = await mergedPdf.save();
                triggerFileDownload(mergedPdfBytes, "Bilingual_Side_By_Side_Aligned.pdf");

            } catch (err) {
                console.error("Assembly thread runtime error context: ", err);
                alert("An unexpected error interrupted document compiler tasks.");
            } finally {
                hideLoader();
            }
        }

        /**
         * Launches immediate download payload streams
         */
        function triggerFileDownload(bytes, filename) {
            const blob = new Blob([bytes], { type: "application/pdf" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function showLoader(message) {
            elements.loaderText.textContent = message;
            elements.loader.classList.remove('hidden');
        }

        function hideLoader() {
            elements.loader.classList.add('hidden');
        }
    </script>
</body>
</html>
